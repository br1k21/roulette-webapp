<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Casino Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Жестко задаем темную тему, чтобы избежать белого экрана */
        :root {
            --bg-color: #0f1015;
            --text-color: #ffffff;
            --accent-color: #00ffcc;
            --danger-color: #ff3366;
            --panel-bg: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .navbar {
            display: flex;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-color);
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-btn.active {
            background: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }

        .game-container {
            display: none;
            flex: 1;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .game-container.active {
            display: flex;
        }

        .panel {
            background: var(--panel-bg);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 350px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .action-btn {
            background: linear-gradient(45deg, #00ffcc, #00b3ff);
            color: #000;
            border: none;
            padding: 16px 20px;
            font-size: 18px;
            font-weight: 800;
            border-radius: 14px;
            width: 100%;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 5px 20px rgba(0, 255, 204, 0.3);
            margin-top: 20px;
        }

        .action-btn:disabled {
            background: #555;
            color: #888;
            box-shadow: none;
        }

        .action-btn.cashout { 
            background: linear-gradient(45deg, #ff9900, #ff5500); 
            box-shadow: 0 5px 20px rgba(255, 153, 0, 0.4); 
            color: #fff;
        }

        .roulette-wrapper {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 0 auto 20px auto;
        }

        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #fff;
            z-index: 10;
        }

        .wheel {
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 4px solid var(--accent-color);
            background: conic-gradient(
                #1a1a24 0deg 60deg, 
                #2a2a35 60deg 120deg, 
                #1a1a24 120deg 180deg, 
                #2a2a35 180deg 240deg, 
                #1a1a24 240deg 300deg, 
                #2a2a35 300deg 360deg
            );
            transition: transform 4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .result-text { font-size: 20px; font-weight: bold; margin-top: 15px; min-height: 28px; color: #aaa;}

        .crash-display {
            font-size: 64px;
            font-weight: 900;
            margin: 30px 0;
            font-variant-numeric: tabular-nums;
        }

        .crash-display.crashed { color: var(--danger-color); }
        .crash-display.flying { color: var(--accent-color); }

        .status-badge {
            display: inline-block;
            background: rgba(255,255,255,0.1);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Навигация -->
    <div class="navbar">
        <button class="nav-btn active" onclick="switchTab('roulette')">🎰 Рулетка</button>
        <button class="nav-btn" onclick="switchTab('crash')">🚀 Ракета</button>
    </div>

    <!-- ИГРА 1: РУЛЕТКА -->
    <div id="roulette" class="game-container active">
        <div class="panel">
            <div class="roulette-wrapper">
                <div class="pointer"></div>
                <div class="wheel" id="wheel"></div>
            </div>
            <div class="result-text" id="rouletteResult">Испытай удачу!</div>
            <button class="action-btn" id="spinBtn">КРУТИТЬ</button>
        </div>
    </div>

    <!-- ИГРА 2: CRASH -->
    <div id="crash" class="game-container">
        <div class="panel">
            <div class="status-badge" id="crashStatus">Готов к запуску</div>
            <div class="crash-display" id="multiplier">1.00x</div>
            <div class="result-text" id="crashLog">Сделай ставку до взлета</div>
            <button class="action-btn" id="crashActionBtn">СТАВКА</button>
        </div>
    </div>

    <script>
        // БЕЗОПАСНАЯ ИНИЦИАЛИЗАЦИЯ TELEGRAM
        let tg = null;
        if (window.Telegram && window.Telegram.WebApp) {
            tg = window.Telegram.WebApp;
            try { tg.expand(); } catch(e) {}
        }

        function playVibration(type) {
            if (tg && tg.HapticFeedback) {
                try {
                    if (type === 'success' || type === 'error') tg.HapticFeedback.notificationOccurred(type);
                    else if (type === 'select') tg.HapticFeedback.selectionChanged();
                    else tg.HapticFeedback.impactOccurred(type);
                } catch(e) {}
            }
        }

        const GAME_CONFIG = {
            roulette: [
                { id: 0, name: "💎 Джекпот (1000⭐️)", chance: 1 },    
                { id: 1, name: "😢 Пусто", chance: 45 },              
                { id: 2, name: "💵 Средний (50⭐️)", chance: 10 },     
                { id: 3, name: "😢 Пусто", chance: 35 },              
                { id: 4, name: "💰 Большой (200⭐️)", chance: 4 },     
                { id: 5, name: "😢 Пусто", chance: 5 }                
            ],
            crash: {
                instantCrashChance: 5, 
                houseEdge: 0.90,
                maxMultiplier: 100.00
            }
        };

        function switchTab(tabId) {
            document.querySelectorAll('.game-container').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
            playVibration('select');
        }

        // РУЛЕТКА
        let currentRotation = 0;
        let isSpinning = false;

        document.getElementById('spinBtn').addEventListener('click', () => {
            if (isSpinning) return;
            isSpinning = true;
            playVibration('medium');
            
            const btn = document.getElementById('spinBtn');
            const resText = document.getElementById('rouletteResult');
            btn.disabled = true;
            resText.style.color = '#aaa';
            resText.innerText = "Крутим...";

            let rand = Math.random() * 100;
            let sum = 0, winningSector = 0;
            for (let p of GAME_CONFIG.roulette) {
                sum += p.chance;
                if (rand <= sum) { winningSector = p.id; break; }
            }

            const spins = 1800; 
            const degreePerSector = 60;
            const randomOffset = Math.floor(Math.random() * 40) - 20;
            currentRotation = currentRotation + spins + (360 - (winningSector * degreePerSector)) - 30 + randomOffset;

            const wheel = document.getElementById('wheel');
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                const winner = GAME_CONFIG.roulette.find(p => p.id === winningSector);
                resText.innerText = winner.name;
                resText.style.color = winner.name.includes("Пусто") ? "#ff3366" : "#00ffcc";
                isSpinning = false;
                btn.disabled = false;
                playVibration(winner.name.includes("Пусто") ? 'error' : 'success');
            }, 4000);
        });

        // CRASH
        let crashState = 'idle'; 
        let currentMultiplier = 1.00;
        let crashPoint = 1.00;
        let crashInterval;
        let startTime;

        const multDisplay = document.getElementById('multiplier');
        const crashBtn = document.getElementById('crashActionBtn');
        const statusBadge = document.getElementById('crashStatus');
        const crashLog = document.getElementById('crashLog');

        crashBtn.addEventListener('click', () => {
            playVibration('light');
            if (crashState === 'idle') startGame();
            else if (crashState === 'flying') cashOut();
            else if (crashState === 'crashed') resetCrash();
        });

        function startGame() {
            crashState = 'flying';
            currentMultiplier = 1.00;
            startTime = Date.now();
            
            let randPercent = Math.random() * 100;
            if (randPercent <= GAME_CONFIG.crash.instantCrashChance) {
                crashPoint = 1.00; 
            } else {
                let rawCrash = GAME_CONFIG.crash.houseEdge / Math.random();
                crashPoint = Math.min(GAME_CONFIG.crash.maxMultiplier, Math.max(1.01, rawCrash)); 
            }
            
            crashBtn.innerText = "ЗАБРАТЬ ДЕНЬГИ";
            crashBtn.classList.add('cashout');
            statusBadge.innerText = "🚀 ПОЛЕТ...";
            statusBadge.style.color = "#00ffcc";
            crashLog.innerText = "Летим!";
            crashLog.style.color = "#aaa";
            multDisplay.classList.remove('crashed');
            multDisplay.classList.add('flying');

            if (crashPoint === 1.00) setTimeout(() => crash(1.00), 100);
            else crashInterval = requestAnimationFrame(updateMultiplier);
        }

        function updateMultiplier() {
            if (crashState !== 'flying') return;
            let elapsed = (Date.now() - startTime) / 1000; 
            currentMultiplier = Math.pow(Math.E, 0.1 * elapsed); 

            if (currentMultiplier >= crashPoint) {
                crash(crashPoint);
                return;
            }
            multDisplay.innerText = currentMultiplier.toFixed(2) + 'x';
            crashInterval = requestAnimationFrame(updateMultiplier);
        }

        function cashOut() {
            if (crashState !== 'flying') return;
            crashState = 'idle'; 
            cancelAnimationFrame(crashInterval);
            playVibration('success');
            multDisplay.classList.remove('flying');
            
            let winAmount = (10 * currentMultiplier).toFixed(0);
            statusBadge.innerText = "УСПЕХ!";
            statusBadge.style.color = "#00ffcc";
            crashLog.innerText = `Вы забрали выигрыш: ${winAmount} ⭐️`;
            crashLog.style.color = "#00ffcc";
            
            crashBtn.innerText = "НОВАЯ ИГРА";
            crashBtn.classList.remove('cashout');
            
            setTimeout(() => {
                multDisplay.innerText = `КРАШ ${crashPoint.toFixed(2)}x`;
            }, 1000);
        }

        function crash(point) {
            crashState = 'crashed';
            cancelAnimationFrame(crashInterval);
            playVibration('error');
            
            multDisplay.innerText = point.toFixed(2) + 'x';
            multDisplay.classList.remove('flying');
            multDisplay.classList.add('crashed');
            
            statusBadge.innerText = "💥 ВЗРЫВ";
            statusBadge.style.color = "#ff3366";
            crashLog.innerText = "Ставка сгорела!";
            crashLog.style.color = "#ff3366";
            
            crashBtn.innerText = "ПОПРОБОВАТЬ СНОВА";
            crashBtn.classList.remove('cashout');
        }

        function resetCrash() {
            crashState = 'idle';
            multDisplay.innerText = "1.00x";
            multDisplay.classList.remove('crashed');
            statusBadge.innerText = "Готов к запуску";
            statusBadge.style.color = "#fff";
            crashLog.innerText = "Сделай ставку до взлета";
            crashLog.style.color = "#aaa";
            crashBtn.innerText = "СТАВКА";
            startGame();
        }
    </script>
</body>
</html>
